name: Release Container Image

on:
  workflow_call:
    inputs:
      app_version:
        description: Application version to release
        required: true
        type: string

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Log in to GHCR
        uses: ./.github/actions/ghcr-login

      - name: Tag release
        id: tag
        run: |
          SRC="${{ env.REGISTRY }}/${{ github.repository }}:${{ github.sha }}"
          DST="${{ env.REGISTRY }}/${{ github.repository }}:${{ inputs.app_version }}"
          LATEST="${{ env.REGISTRY }}/${{ github.repository }}:latest"
          oras copy "$SRC" "$DST"
          oras copy "$SRC" "$LATEST"
          DIGEST=$(oras resolve "$DST")
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Setup Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the container image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository }}:${{ inputs.app_version }}"
          DIGEST=$(oras resolve "$IMAGE")
          cosign sign --yes "${{ env.REGISTRY }}/${{ github.repository }}@${DIGEST}"

      - name: Generate SLSA provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}
          subject-digest: ${{ steps.tag.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository }}:${{ inputs.app_version }}
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository }}:${{ inputs.app_version }}"
          DIGEST=$(oras resolve "$IMAGE")
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${{ env.REGISTRY }}/${{ github.repository }}@${DIGEST}"

      - name: Get release notes
        run: make release-notes TAG="${{ inputs.app_version }}" > .release_notes

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.app_version }}" \
            --notes-file .release_notes \
            --title "${{ inputs.app_version }}" \
            --target ${{ github.sha }} \
            --draft
