name: Release Helm Chart

on:
  workflow_call:
    inputs:
      chart_dir:
        description: Path to the Helm chart directory
        required: false
        type: string
        default: deploy/helm
      chart_version:
        description: Chart version to release
        required: true
        type: string

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  CHART_OCI_REPO: ${{ github.repository_owner }}/charts

jobs:
  release-helm:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Log in to GHCR
        uses: ./.github/actions/ghcr-login

      - name: Get release notes
        run: make helm-release-notes > .release_notes

      - name: Copy LICENSE into chart
        run: cp LICENSE ${{ inputs.chart_dir }}/

      - name: Package chart
        run: make helm-package

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign chart package
        run: |
          PACKAGE=$(ls dist/*.tgz)
          cosign sign-blob "$PACKAGE" --bundle "${PACKAGE}.sigstore.json" --yes

      - name: Push chart to GHCR OCI
        run: helm push dist/*.tgz oci://${{ env.REGISTRY }}/${{ env.CHART_OCI_REPO }}

      - name: Push Artifact Hub metadata
        run: |
          chart_name=$(yq .name "${{ inputs.chart_dir }}/Chart.yaml")
          oras push ${{ env.REGISTRY }}/${{ env.CHART_OCI_REPO }}/${chart_name}:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          is_prerelease="false"
          if [[ "${{ inputs.chart_version }}" == *-* ]]; then
            is_prerelease="true"
          fi
          gh release create "helm-v${{ inputs.chart_version }}" \
            dist/*.tgz \
            dist/*.sigstore.json \
            --notes-file .release_notes \
            --title "helm-v${{ inputs.chart_version }}" \
            --target ${{ github.sha }} \
            --draft \
            $([[ "$is_prerelease" == "true" ]] && echo "--prerelease")
